[workspace]
resolver = "2"
members = [
    "programs/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NeuralMintdev <neuralmintdev@gmail.com>"]
license = "MIT"
repository = "https://github.com/NeuralMintdev/neuralmint"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
